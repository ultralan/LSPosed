name: 发布 APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 恢复发布签名
        env:
          LSPOSED_KEYSTORE_BASE64: ${{ secrets.LSPOSED_KEYSTORE_BASE64 }}
        run: echo "$LSPOSED_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lsposed-release.jks"

      - name: 测试并构建正式 APK
        env:
          LSPOSED_KEYSTORE_PATH: ${{ runner.temp }}/lsposed-release.jks
          LSPOSED_STORE_PASSWORD: ${{ secrets.LSPOSED_STORE_PASSWORD }}
          LSPOSED_KEY_PASSWORD: ${{ secrets.LSPOSED_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean :app:testDebugUnitTest :app:assembleRelease

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/LSPosed.apk \
            --title "LSPosed $GITHUB_REF_NAME" \
            --generate-notes
