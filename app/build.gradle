plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystorePath = System.getenv('LSPOSED_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('LSPOSED_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('LSPOSED_KEY_PASSWORD')
def releaseSigningConfigured = releaseKeystorePath && releaseStorePassword && releaseKeyPassword

android {
    namespace 'io.github.ultralan.lsposed'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ultralan.lsposed'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias 'lsposed'
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = 'LSPosed.apk'
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.0.21'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
